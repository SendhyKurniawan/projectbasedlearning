services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: pjbl-app
        container_name: pjbl-app
        restart: unless-stopped
        working_dir: /var/www
        # No env_file: on first boot .env doesn't exist yet — the entrypoint
        # creates it from .env.example. Laravel reads .env directly, and the
        # entrypoint's wait-for-db defaults to host=db port=3306.
        volumes:
            - ./:/var/www
            # Keep the baked-in vendor/ and node_modules/ from being shadowed
            # by an empty host folder on a fresh clone.
            - app_vendor:/var/www/vendor
            - app_node_modules:/var/www/node_modules
            - app_build:/var/www/public/build
        networks:
            - pjbl-network
        depends_on:
            db:
                condition: service_healthy
            mailhog:
                condition: service_started

    web:
        image: nginx:alpine
        container_name: pjbl-web
        restart: unless-stopped
        ports:
            # Bind to localhost only — Caddy on the host VM reverse-proxies to this.
            # Outside traffic must go through Caddy (HTTPS) on 443.
            - "127.0.0.1:8000:80"
        volumes:
            - ./:/var/www
            - app_build:/var/www/public/build
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        networks:
            - pjbl-network
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: pjbl-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-pjbl}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MYSQL_USER: ${DB_USERNAME:-pjbl}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - pjbl-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
            interval: 5s
            timeout: 5s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: pjbl-phpmyadmin
        restart: unless-stopped
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            PMA_USER: root
            PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        networks:
            - pjbl-network
        depends_on:
            - db

    mailhog:
        image: mailhog/mailhog
        container_name: pjbl-mailhog
        restart: unless-stopped
        ports:
            - "8025:8025"
        networks:
            - pjbl-network

    piston:
        image: ghcr.io/engineer-man/piston
        container_name: pjbl-piston
        restart: unless-stopped
        privileged: true
        tmpfs:
            - /piston/jobs
        volumes:
            - piston_packages:/piston/packages
        networks:
            - pjbl-network

networks:
    pjbl-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
    app_vendor:
        driver: local
    app_node_modules:
        driver: local
    app_build:
        driver: local
    piston_packages:
        driver: local
