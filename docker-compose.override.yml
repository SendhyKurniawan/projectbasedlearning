services:
  caddy:
    image: caddy:2-alpine
    container_name: pjbl-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pjbl-network
    depends_on:
      - web

  coturn:
    image: coturn/coturn:latest
    container_name: pjbl-coturn
    restart: unless-stopped
    # host networking avoids Docker NAT issues for the TURN relay port range
    network_mode: host
    # cap TURN relay logs so they can't fill the disk (was an unbounded 4GB json log)
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - /home/sendhy27_gmail_com/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  caddy_data:
    external: true
    name: pjbl_caddy_data
  caddy_config:
    external: true
    name: pjbl_caddy_config
